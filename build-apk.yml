name: Build GLRE Android App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: unzip -o android-project.zip -d android-build
        - name: Fix PDF download Toasts
  run: |
    sed -i 's/Toast.makeText(this, "PDF download started"/Toast.makeText(MainActivity.this, "PDF download started"/' android-build/app/src/main/java/com/glre/projectsignoff/MainActivity.java
    sed -i 's/Toast.makeText(this, "Unable to download PDF"/Toast.makeText(MainActivity.this, "Unable to download PDF"/' android-build/app/src/main/java/com/glre/projectsignoff/MainActivity.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-build
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GLRE-Project-Sign-Off-debug
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
