name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q android-project.zip -d android-project

      - name: Find Android project
        run: |
          echo "Looking for Android project..."
          find android-project -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find android-project -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          echo "Android project found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          find android-project -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GLRE-Project-Sign-Off
          path: android-project/**/*.apk
          if-no-files-found: error
