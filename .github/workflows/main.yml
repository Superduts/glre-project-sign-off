name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q android-project.zip -d android-project
          echo "Contents:"
          find android-project -maxdepth 3 -type f | head -100

      - name: Build APK
        working-directory: android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GLRE-Project-Sign-Off
          path: android-project/**/build/outputs/apk/debug/*.apk
